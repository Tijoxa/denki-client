[project]
name = "denki-client"
version = "0.3.0"
description = "Asynchronous ENTSO-e API client returning Polars DataFrames."
readme = "README.md"
authors = [
    { name = "Tijoxa", email = "92037181+Tijoxa@users.noreply.github.com" },
]
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx2>=2.16.2",
    "polars>=1.34.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "tenacity>=9.1.2",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "denki_client._core"
python-packages = ["denki_client"]
python-source = "src"

[dependency-groups]
dev = [
    "httpx-limiter[aiolimiter,httpx2]>=0.7.0,<0.8",
    "marimo>=0.18.0",
    "pytest>=8.3.5",
    "pytest-asyncio>=1.1.0",
    "pyzmq>=27.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["live: requires access to the ENTSO-e API"]

[tool.ruff]
line-length = 120

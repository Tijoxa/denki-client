name: Build and test Python wheels

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: "off"
          - runner: macos-15
            target: aarch64-apple-darwin
            manylinux: "off"
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false
      - name: Build the wheel
        uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: v1.16.0
          rust-toolchain: stable
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked -i python3.12 --out dist
      - name: Test the installed wheel
        shell: bash
        run: |
          uv pip install --system dist/*.whl pytest pytest-asyncio 'hishel[httpx2]>=2.0.0'
          python -m pytest -m 'not live'
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7
